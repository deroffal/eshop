info:
  name: get
  type: http
  seq: 1

http:
  method: GET
  url: "{{marketplace.url}}/product/73aa5936-4410-47a7-96c3-80407b57d710"
  body:
    type: json
    data: |-
      [
          {
              "item": "book",
              "quantity": 2
          },
          {
              "item": "ball",
              "quantity": 3
          }
      ]

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.product.id
      operator: eq
      value: 73aa5936-4410-47a7-96c3-80407b57d710
    - expression: res.body.product.name
      operator: eq
      value: bike 1
    - expression: res.body.product.description
      operator: eq
      value: This is product 1.
    - expression: res.body.quantity
      operator: eq
      value: "10"
    - expression: res.body.price.amount
      operator: eq
      value: "1200"
    - expression: res.body.price.currency
      operator: eq
      value: EUR

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
