info:
  name: item
  type: http
  seq: 2

http:
  method: PUT
  url: "{{marketplace.url}}/cart/{{cartId}}"
  body:
    type: json
    data: |-
      {
          "product": "73aa5936-4410-47a7-96c3-80407b57d710",
          "quantity": 2
      }

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.id
      operator: eq
      value: "{{cartId}}"
    - expression: res.body.items[0].product
      operator: eq
      value: 73aa5936-4410-47a7-96c3-80407b57d710
    - expression: res.body.items[0].quantity
      operator: eq
      value: "2"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
